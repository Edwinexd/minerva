name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      # protoc needed by `tonic-build` (via `prost-build`) in
      # minerva-rpc's build.rs to compile the .proto files.
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build

      # Includes the in-process gRPC roundtrip tests added in the
      # microservices split (crates/minerva-rpc/tests/grpc_roundtrip.rs).
      - name: Test
        run: cargo test --workspace

      # Handed to `frontend-a11y`, which needs a real backend to render the
      # authenticated pages. Reusing this build keeps that job on Node only.
      - name: Upload server binary
        uses: actions/upload-artifact@v4
        with:
          name: minerva-server
          path: backend/target/debug/minerva
          retention-days: 1

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc -b

      - name: Type check (tests)
        run: npx tsc -p tsconfig.test.json

      - name: Accessibility tests (vitest + axe-core)
        run: npx vitest run

      - name: Build
        run: npm run build

  frontend-a11y:
    name: Frontend accessibility (pa11y-ci)
    runs-on: ubuntu-latest
    # Needs the server binary; a11y coverage of the authenticated pages is the
    # point, and those only render against a real backend.
    needs: backend
    defaults:
      run:
        working-directory: frontend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: minerva
          POSTGRES_PASSWORD: minerva
          POSTGRES_DB: minerva
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        # pa11y-ci pulls puppeteer, whose postinstall downloads the Chromium
        # build pa11y drives (lands in ~/.cache/puppeteer).
        run: npm ci

      - name: Build
        run: npm run build

      - name: Download server binary
        uses: actions/download-artifact@v5
        with:
          name: minerva-server
          path: ${{ runner.temp }}/bin

      - name: Start backend serving the built SPA
        working-directory: ${{ github.workspace }}
        env:
          DATABASE_URL: postgres://minerva:minerva@localhost:5432/minerva
          # Lazily-connected gRPC channels, so these never have to resolve:
          # nothing in an a11y pass embeds or reranks. Pointing them at unused
          # ports is what lets this reuse the plain `cargo build` artifact
          # instead of needing a `--features local-engine` rebuild.
          MINERVA_EMBEDDER_URL: http://127.0.0.1:59051
          MINERVA_RERANKER_URL: http://127.0.0.1:59052
          QDRANT_URL: http://127.0.0.1:56334
          # The seeded documents would otherwise be claimed and pushed at the
          # embedder that isn't there, filling the log with failures.
          MINERVA_RUN_WORKER: "false"
          MINERVA_DEV_MODE: "true"
          # The header's dev user-switcher persists its first option
          # (`student@su.se`) to localStorage on first load, after which
          # `api.ts` sends that as X-Dev-User on every request, overriding the
          # header pa11y sets. Whichever wins the race decides what renders, so
          # rather than fight it, grant admin to exactly that identity: both
          # paths then resolve to the same admin and every page renders its
          # full authenticated state deterministically.
          MINERVA_ADMINS: student
          MINERVA_HMAC_SECRET: pa11y-ci-secret
          # `Config::from_env` hard-requires this one, so the process exits
          # before it binds without it. No a11y page completes a chat turn;
          # the only reader is /api/models, which falls back to its static
          # list when the key is rejected.
          CEREBRAS_API_KEY: pa11y-ci-not-a-real-key
          MINERVA_DOCS_PATH: ${{ runner.temp }}/a11y-docs
          MINERVA_STATIC_DIR: ${{ github.workspace }}/frontend/dist
          MINERVA_PORT: "3000"
          MINERVA_METRICS_PORT: "0"
        run: |
          chmod +x "${{ runner.temp }}/bin/minerva"
          mkdir -p "${{ runner.temp }}/a11y-docs"
          # Migrations run on startup via the sqlx `migrate!()` macro. The
          # pa11y step waits for /api/health, so no sleep here. Backgrounded
          # for the life of the job; the runner tears it down.
          "${{ runner.temp }}/bin/minerva" > "${{ runner.temp }}/backend.log" 2>&1 &

      - name: Run pa11y-ci over public and authenticated pages
        # Real-browser WCAG 2.2 AA pass. Complements the jsdom/axe component
        # tests in the `frontend` job, which cannot evaluate any rule that
        # depends on layout (contrast, scrollable regions) because jsdom
        # reports every element as zero-sized.
        env:
          MINERVA_BASE_URL: http://127.0.0.1:3000
          MINERVA_A11Y_ADMIN: student@su.se
          MINERVA_HMAC_SECRET: pa11y-ci-secret
        run: npm run pa11y

      # Surfaced on failure: a pa11y run that audits a 500 page still
      # "passes" its own rules, so the backend log is where a broken seed or
      # migration actually shows up.
      - name: Backend log
        if: always()
        run: tail -100 "${{ runner.temp }}/backend.log" || true

  moodle-plugin:
    name: Moodle plugin
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: moodle-plugin/local/minerva
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"

      - name: Syntax check
        run: find . -name '*.php' -exec php -l {} + | (! grep -v 'No syntax errors')

      - name: Install Moodle coding standards
        run: |
          composer global config allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require moodlehq/moodle-cs

      - name: Code style
        run: |
          PHPCS="$(composer global config home)/vendor/bin/phpcs"
          "$PHPCS" --standard=moodle --extensions=php .

  apache:
    name: Apache (Lua + vhost configtest)
    # Run inside a Debian container so apt package names match the prod
    # host (libapache2-mod-lua, libapache2-mod-shib2). Ubuntu 24.04 ships
    # mod_lua bundled differently and would skew the test.
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - uses: actions/checkout@v7

      - name: Install lua + apache + mods
        # mod_lua is bundled into apache2-bin on Debian trixie (no
        # separate libapache2-mod-lua package), so just installing
        # apache2 brings it along. mod_shib lives in its own package.
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            lua5.4 apache2 libapache2-mod-shib

      - name: Lua syntax + unit tests
        env:
          LUA: lua5.4
        run: bash apache/test/run.sh

      - name: Stage minerva apache config in this runner
        run: |
          install -d -m 0750 -o root -g www-data /etc/apache2/secrets
          # configtest just needs the file to exist; the value is unused here.
          echo dummy > /etc/apache2/secrets/minerva-hmac
          chown root:www-data /etc/apache2/secrets/minerva-hmac
          chmod 0640 /etc/apache2/secrets/minerva-hmac

          install -d -m 0755 /etc/apache2/lua
          install -m 0644 apache/minerva-ext-auth.lua /etc/apache2/lua/minerva-ext-auth.lua

          # Drop the Debian default site so our vhost is the only one and any
          # name conflict surfaces immediately.
          rm -f /etc/apache2/sites-enabled/000-default.conf
          install -m 0644 apache/minerva-app.conf /etc/apache2/sites-enabled/minerva-app.conf

          # Same mods as prod.
          a2enmod ssl proxy proxy_http proxy_wstunnel rewrite headers lua shib >/dev/null

      - name: apache2ctl configtest
        run: apache2ctl configtest

  emdash-check:
    name: Ban emdashes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check for emdashes
        run: |
          # backend/migrations/ is excluded: applied migrations are
          # content-hashed by sqlx (see migrations-immutable hook), so
          # historical occurrences cannot be retro-cleaned.
          mapfile -t FILES < <(git ls-files \
            '*.rs' '*.ts' '*.tsx' '*.toml' '*.yml' '*.yaml' '*.md' '*.sql' '*.php' \
            | grep -vE '^backend/migrations/.*\.sql$')
          if grep -n $'\xe2\x80\x94' "${FILES[@]}"; then
            echo "::error::Emdashes found! Use a semicolon, colon, or rephrase the sentence instead."
            exit 1
          fi

      - name: Check for space-dash-dash-space
        run: |
          # Banned because LLMs reach for this as an em-dash workaround.
          # Requires a non-whitespace char before the space-dash-dash-space on
          # the same line: that carve-out keeps genuine indented SQL/Lua
          # comments legal while inline comments after code, mid-prose dashes,
          # and string-literal occurrences still fail.
          # YAML/lockfiles/vendored deps are excluded; YAML carves out cargo
          # CLI invocations that legitimately use the end-of-options separator.
          # Pattern uses hex escapes so this workflow itself is clean.
          # Mirrors the pre-commit hook (ban-double-dash) so any file the hook
          # scans is also scanned in CI.
          # backend/migrations/ is excluded for the same reason as the
          # emdash check above: applied migrations are content-hashed and
          # immutable, so historical occurrences cannot be retro-cleaned.
          mapfile -t FILES < <(git ls-files | grep -vE '(\.lock$|\.ya?ml$|^frontend/node_modules/|^backend/target/|/dist/|\.gen\.|^backend/migrations/.*\.sql$)')
          # Perl exits 1 when at least one match was printed; let bash see that
          # exit code directly. `set -e` is on by default in `run:` blocks, so
          # a non-zero exit fails the step.
          if ! perl -ne 'BEGIN { $rc = 0 } if (/\S.*\x20--\x20/) { print STDERR "$ARGV:$.: $_"; $rc = 1 } END { exit $rc }' "${FILES[@]}"; then
            echo "::error::space-dash-dash-space found! Use a semicolon, colon, or rephrase. Inline SQL comments must move to their own line."
            exit 1
          fi

  validate-dashboards:
    name: Grafana dashboards are valid
    # Validates the git-managed Grafana dashboards (JSON well-formed, panels
    # tile the 24-col grid with no overlaps/gaps, datasource uids exist,
    # uids unique, configMapGenerator file list in sync). Mirrors the
    # `validate-dashboards` pre-commit hook so a contributor who skips
    # pre-commit is still caught here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check
        run: python3 scripts/validate-dashboards.py

  migrations-immutable:
    name: Migrations are immutable once committed
    # Blocks any PR or push that modifies an existing
    # backend/migrations/*.sql file relative to the SHA pinned in
    # .migrations-immutable-baseline. Net-new migrations (files that
    # don't exist at the baseline) are always allowed. Mirrors the
    # `migrations-immutable` pre-commit hook so a contributor who skips
    # pre-commit is still caught here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Need full history so the baseline SHA is reachable.
          fetch-depth: 0

      - name: Check
        run: bash scripts/check-migrations-immutable.sh
