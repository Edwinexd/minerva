[package]
name = "minerva-fetcher"
version = "0.1.0"
edition = "2021"

# Standalone lecture-video fetcher: probes a lecture's Play sources for the
# slide track and downloads the winner into the visual extraction staging
# window. Needs only the database and the staging volume, so it builds no
# AppState: no model clients, no LLM keys. Its image is the only one that
# carries ffmpeg and tesseract (see EXTRA_PACKAGES in docker.yml).

[[bin]]
name = "minerva-fetcher"
path = "src/main.rs"

[dependencies]
minerva-app-core = { path = "../minerva-app-core" }
minerva-db = { path = "../minerva-db" }
minerva-metrics = { path = "../minerva-metrics" }

tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
dotenvy.workspace = true
anyhow = "1"
axum.workspace = true
chrono.workspace = true
futures.workspace = true
metrics.workspace = true
reqwest.workspace = true
serde_json.workspace = true
sqlx.workspace = true

[dev-dependencies]
tempfile.workspace = true
