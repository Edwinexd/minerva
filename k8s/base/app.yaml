apiVersion: apps/v1
kind: Deployment
metadata:
  name: minerva-app
  namespace: minerva
spec:
  replicas: 1
  # Zero-downtime rollout. Unlike the embedder / reranker (which can't
  # fit two model-cache pods on the node), the api is light enough at
  # 1Gi to surge a second pod, so a deploy never leaves the service
  # without an endpoint. maxUnavailable: 0 is the half that matters:
  # the old pod is only sent SIGTERM once the new one passes its
  # readiness probe.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  # A pod that goes Ready and then immediately dies (bad config, a
  # migration that fails on second query) shouldn't count as a
  # successful rollout step and let the old pod be torn down.
  minReadySeconds: 10
  selector:
    matchLabels:
      app: minerva-app
  template:
    metadata:
      annotations:
        # Prometheus pod-SD scrape config (see k8s/base/observability/).
        # Scraped on the dedicated metrics port, not the public 3000.
        prometheus.io/scrape: "true"
        prometheus.io/port: "9464"
        prometheus.io/path: "/metrics"
      labels:
        app: minerva-app
        # Intended NetworkPolicy selector (policy not yet applied): pods
        # with this label are the only ones meant to reach the
        # embedder/reranker ClusterIP services.
        minerva-internal-client: "true"
    spec:
      containers:
        - name: minerva-app
          image: ghcr.io/edwinexd/minerva:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
            - containerPort: 9464
              name: metrics
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: minerva-secrets
                  key: DATABASE_URL
            - name: QDRANT_URL
              value: "http://qdrant:6334"
            - name: MINERVA_HOST
              value: "0.0.0.0"
            - name: MINERVA_PORT
              value: "3000"
            - name: MINERVA_DOCS_PATH
              value: "/data/documents"
            # Post-split: api routes embed + rerank to the dedicated
            # pods via gRPC. No local FastEmbedder / FastReranker
            # cache is constructed, no model weights resident in this
            # pod, no HF_HOME mount needed.
            - name: MINERVA_EMBEDDER_URL
              value: "http://minerva-embedder.minerva.svc.cluster.local:50051"
            - name: MINERVA_RERANKER_URL
              value: "http://minerva-reranker.minerva.svc.cluster.local:50052"
            # Worker + schedulers run in their own pods; api doesn't
            # spawn them. Setting this `false` is the Phase 3 cutover
            # step from the design doc.
            - name: MINERVA_RUN_WORKER
              value: "false"
            - name: MINERVA_HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: minerva-secrets
                  key: MINERVA_HMAC_SECRET
            - name: MINERVA_ADMINS
              valueFrom:
                secretKeyRef:
                  name: minerva-secrets
                  key: MINERVA_ADMINS
            - name: CEREBRAS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: minerva-secrets
                  key: CEREBRAS_API_KEY
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: minerva-secrets
                  key: OPENAI_API_KEY
            - name: MINERVA_SERVICE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: minerva-secrets
                  key: MINERVA_SERVICE_API_KEY
          volumeMounts:
            # Shared docs hostPath; api writes uploads + serves
            # downloads, worker / scheduler also mount it. See
            # docs/ARCHITECTURE.md "Service topology".
            - name: app-data
              mountPath: /data
          resources:
            # Memory req == lim for Guaranteed QoS; we own memory
            # accounting ourselves. CPU is ranged: chat strategy +
            # axum + sqlx is mostly I/O-bound at steady state, but a
            # streaming chat reply with a busy LLM round trip + RAG
            # rerank + qdrant search can briefly burn most of a core.
            # Low req = scheduler-friendly; lim = burst headroom.
            # Post-split the api has no FastEmbedder / FastReranker
            # cache, no in-process worker, just HTTP + auth + chat
            # strategy + sqlx + qdrant + tonic clients. Steady state
            # ~500-600 MiB; 1 GiB gives slack for chat streaming +
            # memprobe + occasional spikes.
            requests:
              memory: "1Gi"
              cpu: "50m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          lifecycle:
            preStop:
              exec:
                # Endpoint removal and kube-proxy's iptables update are
                # asynchronous, so for a moment after the pod is marked
                # Terminating the node still DNATs new connections to
                # it. Keep serving across that window; the SIGTERM that
                # starts the real drain is only sent after this returns.
                # (The runtime image is debian-slim, so /bin/sleep is
                # present and this doesn't need the newer native
                # `lifecycle.preStop.sleep` field.)
                command: ["/bin/sleep", "5"]
          startupProbe:
            httpGet:
              path: /api/health
              port: 3000
            # AppState::new runs migrations, seeds the embedding /
            # reranker / chat-model catalogs and system_defaults, and
            # only then binds the listener, so boot is genuinely slow.
            # 3s x 60 gives it 3 minutes before the pod is declared
            # failed, without making the liveness probe lenient after
            # startup.
            periodSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            # No initialDelaySeconds: the startupProbe already gates
            # this, and a short period makes the rollout cut over to the
            # new pod promptly.
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 30
      # Bounds the whole termination: the 5s preStop above, then axum's
      # graceful shutdown draining in-flight chat / embed SSE streams. A
      # long streamed answer is why this is 120 and not the 30s default.
      # Anything still open when it expires is SIGKILLed.
      terminationGracePeriodSeconds: 120
      volumes:
        - name: app-data
          hostPath:
            path: /data0/minerva/data
            type: DirectoryOrCreate
