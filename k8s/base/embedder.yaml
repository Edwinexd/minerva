apiVersion: apps/v1
kind: Deployment
metadata:
  name: minerva-embedder
  namespace: minerva
spec:
  # Single replica: the FastEmbedder LRU is per-pod, so multi-replica
  # doubles cache RAM. Start with one; add HPA only when chat queue
  # depth shows it's needed (see docs/ARCHITECTURE.md "Service
  # topology").
  replicas: 1
  strategy:
    # Recreate (not RollingUpdate) because the node can't fit two
    # embedder pods at once (3.5 GiB each on an 8 GiB allocatable
    # node). Brief embed downtime during a deploy is the trade.
    type: Recreate
  selector:
    matchLabels:
      app: minerva-embedder
  template:
    metadata:
      annotations:
        # Prometheus pod-SD scrape config (see k8s/base/observability/).
        # The embedder pod's RSS gauges are the highest-value series in
        # the stack: this is where model-load OOMs originate.
        prometheus.io/scrape: "true"
        prometheus.io/port: "9464"
        prometheus.io/path: "/metrics"
      labels:
        app: minerva-embedder
        minerva-internal-client: "false"
    spec:
      containers:
        - name: minerva-embedder
          image: ghcr.io/edwinexd/minerva-embedder:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 50051
              name: grpc
            - containerPort: 9464
              name: metrics
          env:
            - name: MINERVA_EMBEDDER_HOST
              value: "0.0.0.0"
            - name: MINERVA_EMBEDDER_PORT
              value: "50051"
            - name: HF_HOME
              value: "/data/hf-cache"
            # Cache budget MUST exceed the warmed size of the model
            # every course uses, or that model can never stay resident
            # and every chat query pays a multi-second cold reload.
            # Measured at boot: Snowflake/snowflake-arctic-embed-m-v2.0
            # (146 of 147 active courses) warms to ~3278 MiB. The old
            # 2560 MiB budget was BELOW that, so arctic churned on the
            # hot path. 4 GiB (4 * 2^30 = 4294967296) keeps arctic
            # comfortably resident with ~800 MiB of cache headroom;
            # baseline (~1 GiB) + arctic (3.3 GiB) sits under the 6 GiB
            # pod limit. nomic (the 1 remaining course) still cold-
            # loads on demand and evicts arctic, but that's one course,
            # not the fleet.
            - name: MINERVA_FASTEMBED_CACHE_BUDGET_BYTES
              value: "4294967296"
            - name: MALLOC_TRIM_THRESHOLD_
              value: "131072"
            - name: MALLOC_ARENA_MAX
              value: "2"
            - name: RUST_LOG
              value: "info"
          volumeMounts:
            - name: hf-cache
              mountPath: /data
          resources:
            # req == lim so the pod gets Guaranteed QoS. We handle our
            # own memory budgeting inside the process (FastEmbedder LRU
            # with an explicit MINERVA_FASTEMBED_CACHE_BUDGET_BYTES
            # set above) so the k8s burstable gap buys nothing useful;
            # equal values give us a stable cgroup limit from startup,
            # keep the scheduler from over-promising this pod's memory
            # to a noisy neighbour, and put us at the top of the
            # eviction order during real node pressure.
            #
            # 6 GiB = 4 GiB cache budget + ~1 GiB baseline (gRPC server
            # + tokio + ORT runtime + glibc + tonic connections) + ~1 GiB
            # of slack.
            #
            # History, because the number looks arbitrary otherwise.
            # This started at 5 GiB and OOM-crashlooped. Raising it was
            # treating a symptom: the real causes were the cache
            # recording a model's cost as +0 MiB when an eviction's pages
            # had not left RSS, and two concurrent callers each loading
            # the same model. Both are fixed in `model_cache`, and both
            # had to be fixed regardless of the limit.
            #
            # 5 GiB was then tried again on top of those fixes, and put
            # back:
            # a memory-capped container survived boot plus concurrent
            # churn at 5 GiB (peak 3855 MiB), but that harness was
            # missing what prod does at the same time. Live chat, 4-way
            # concurrent ingest, admin benchmarks, and arctic/nomic
            # swapping all land together, and with arctic at 3456 MiB
            # against nomic at 3072 MiB only one fits the 4 GiB budget,
            # so a swap under load leaves the outgoing model's pages
            # resident while the incoming one allocates. That crossed
            # 5 GiB repeatedly. The extra GiB is for that overlap, not
            # for the steady state, which sits near 3.7 GiB.
            # Memory req == lim for Guaranteed QoS; CPU is ranged
            # because ONNX inference is heavily compute-bound when a
            # batch arrives but idle between. Low req keeps the
            # scheduler happy on a 2-CPU node; 2 CPU limit gives the
            # dispatcher real cores for the bursty embed call.
            requests:
              # Steady state is ~3.7 GiB; the headroom is for the window
              # where an outgoing model's pages have not left RSS yet and
              # the incoming one is already allocating.
              memory: "6Gi"
              cpu: "200m"
            limits:
              memory: "6Gi"
              cpu: "2000m"
          # No HTTP endpoint; rely on the gRPC port being open as a
          # liveness signal. Tonic accepts TCP before model load
          # completes, so this won't gate startup on warmup.
          readinessProbe:
            tcpSocket:
              port: 50051
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 50051
            initialDelaySeconds: 30
            periodSeconds: 30
      # Left at the k8s default, stated explicitly because it's an
      # ops-facing knob. tonic's serve_with_shutdown only has to drain
      # in-flight Embed / EmbedQuery RPCs, which are a batch of
      # inference each, not minutes of work. This deployment is
      # Recreate, so every extra second here is embed downtime during a
      # deploy; there's nothing to buy by raising it.
      terminationGracePeriodSeconds: 30
      volumes:
        - name: hf-cache
          hostPath:
            path: /data0/minerva/hf-cache-embed
            type: DirectoryOrCreate
