apiVersion: apps/v1
kind: Deployment
metadata:
  name: minerva-embedder
  namespace: minerva
spec:
  # Single replica: the FastEmbedder LRU is per-pod, so multi-replica
  # doubles cache RAM. Start with one; add HPA only when chat queue
  # depth shows it's needed (see docs/ARCHITECTURE.md "Service
  # topology").
  replicas: 1
  strategy:
    # Recreate (not RollingUpdate) because the node can't fit two
    # embedder pods at once on the single 16 GiB node. Brief embed
    # downtime during a deploy is the trade.
    type: Recreate
  selector:
    matchLabels:
      app: minerva-embedder
  template:
    metadata:
      annotations:
        # Prometheus pod-SD scrape config (see k8s/base/observability/).
        # The embedder pod's RSS gauges are the highest-value series in
        # the stack: this is where model-load OOMs originate.
        prometheus.io/scrape: "true"
        prometheus.io/port: "9464"
        prometheus.io/path: "/metrics"
      labels:
        app: minerva-embedder
        minerva-internal-client: "false"
    spec:
      containers:
        - name: minerva-embedder
          image: ghcr.io/edwinexd/minerva-embedder:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 50051
              name: grpc
            - containerPort: 9464
              name: metrics
          env:
            - name: MINERVA_EMBEDDER_HOST
              value: "0.0.0.0"
            - name: MINERVA_EMBEDDER_PORT
              value: "50051"
            - name: HF_HOME
              value: "/data/hf-cache"
            # Arctic (3456 MiB), Nomic (3072 MiB), and CLIP text (512 MiB)
            # have conservative warmed-RSS floors totaling 7040 MiB.
            # The old 4 GiB cache admitted Arctic alone and permanently
            # deferred Nomic background jobs. 7 GiB lets this production
            # working set coexist. Native inference and warmup are capped
            # at eight texts; ONNX warmup exercises the full token cap.
            - name: MINERVA_FASTEMBED_CACHE_BUDGET_BYTES
              value: "7516192768"
            - name: MALLOC_TRIM_THRESHOLD_
              value: "131072"
            - name: MALLOC_ARENA_MAX
              value: "2"
            - name: RUST_LOG
              value: "info"
          volumeMounts:
            - name: hf-cache
              mountPath: /data
          resources:
            # Budget review (Oct 2026): dense OCR inference repeatedly
            # OOM-killed the old 6 GiB pod. Separate resident cache from
            # transient allocation: 7 GiB cache and request, 8 GiB limit.
            # The central eight-text bound also applies to benchmarks and
            # warmup, which previously bypassed dispatcher batching.
            #
            # Live node allocatable memory is 16235 MiB. Other steady-state
            # requests total 7708 MiB; this 7168 MiB request leaves 1359
            # MiB, enough for the API's 1024 MiB rolling-deploy surge and
            # the 192 MiB combined backup requests. An 8 GiB request would
            # prevent the API surge from scheduling. CPU is burstable too;
            # this pod is Burstable, not Guaranteed QoS.
            requests:
              memory: "7Gi"
              cpu: "200m"
            limits:
              memory: "8Gi"
              cpu: "2000m"
          # No HTTP endpoint; rely on the gRPC port being open as a
          # liveness signal. Tonic accepts TCP before model load
          # completes, so this won't gate startup on warmup.
          readinessProbe:
            tcpSocket:
              port: 50051
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 50051
            initialDelaySeconds: 30
            periodSeconds: 30
      # Left at the k8s default, stated explicitly because it's an
      # ops-facing knob. tonic's serve_with_shutdown only has to drain
      # in-flight Embed / EmbedQuery RPCs, which are a batch of
      # inference each, not minutes of work. This deployment is
      # Recreate, so every extra second here is embed downtime during a
      # deploy; there's nothing to buy by raising it.
      terminationGracePeriodSeconds: 30
      volumes:
        - name: hf-cache
          hostPath:
            path: /data0/minerva/hf-cache-embed
            type: DirectoryOrCreate
